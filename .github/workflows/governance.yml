name: Governance checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    name: Governance integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run governance unit tests
        run: node --test tests/governance.test.mjs
      - name: Validate required documents and local links
        run: node scripts/check-governance.mjs
